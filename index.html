<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Reference Archive</title>
<meta name="theme-color" content="#F3EEE3" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Archive" />
<style>
  :root{
    --paper:#F3EEE3; --paper-dark:#E7DFCC; --fold:#DCD0B4;
    --ink:#3B3229; --ink-soft:#7A7061; --stamp:#B0512F;
    --sage:#748059; --card:#FFFDF8; --line:#DAD0B8; --danger:#A8442E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .serif{ font-family:Georgia,'Noto Serif KR',serif; }
  .mono{ font-family:'IBM Plex Mono','Courier New',monospace; }
  button{ font:inherit; cursor:pointer; background:none; border:none; color:inherit; }
  input,textarea,select{ font:inherit; color:inherit; }
  img{ max-width:100%; display:block; }

  header.app-header{
    padding:14px 18px 12px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:var(--paper); z-index:10;
  }
  .header-top{ display:flex; align-items:center; justify-content:space-between; }
  .header-bottom{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
  .brand{ display:flex; align-items:baseline; gap:6px; }
  .brand b{ font-size:17px; letter-spacing:.02em; }
  .brand span{ font-size:11px; color:var(--stamp); }

  .tabs{ display:flex; gap:2px; padding:2px; background:var(--paper-dark); border-radius:6px; overflow-x:auto; scrollbar-width:none; flex:1; min-width:0; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabs button{ display:flex; align-items:center; gap:5px; padding:7px 10px; border-radius:5px; font-size:12px; color:var(--ink-soft); white-space:nowrap; flex-shrink:0; }
  .tabs button.active{ background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(59,50,41,.08); }

  .btn-primary{ display:flex; align-items:center; gap:6px; padding:8px 13px; background:var(--ink); color:#fff; border-radius:6px; font-size:12.5px; white-space:nowrap; flex-shrink:0; }
  .btn-ghost{ padding:8px; border-radius:6px; color:var(--ink-soft); }
  .btn-ghost:hover{ background:rgba(0,0,0,.05); }

  main{ max-width:760px; margin:0 auto; padding:22px 18px 60px; }

  /* calendar */
  .cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .cal-head h2{ margin:0; font-size:22px; letter-spacing:.07em; font-weight:700; }
  .cal-head h2 em{ font-style:normal; font-weight:400; color:var(--ink-soft); }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  @media(min-width:480px){ .cal-grid{ gap:10px; } }
  .cal-dow{ text-align:center; font-size:10.5px; color:var(--ink-soft); letter-spacing:.08em; padding-bottom:6px; }
  .cal-cell{ position:relative; aspect-ratio:1; border-radius:4px; border:1px solid transparent; display:flex; flex-direction:column; overflow:hidden; text-align:left; }
  .cal-cell.has-entry{ background:var(--card); border-color:var(--line); }
  .cal-cell.today{ border-color:var(--stamp); }
  .cal-cell .d{ font-size:10.5px; color:var(--ink-soft); padding:3px 5px; }
  .cal-cell.today .d{ color:var(--stamp); }
  .cal-thumb{ flex:1; margin:0 4px 4px; border-radius:2px; overflow:hidden; }
  .cal-thumb img{ width:100%; height:100%; object-fit:cover; }
  .cal-dot{ flex:1; display:flex; align-items:center; justify-content:center; }
  .cal-dot span{ width:5px; height:5px; border-radius:99px; background:var(--sage); display:block; }
  .cal-more{ position:absolute; bottom:3px; right:3px; font-size:9px; color:#fff; background:var(--ink); border-radius:99px; padding:0 4px; }
  .io-badge{ position:absolute; font-family:'IBM Plex Mono','Courier New',monospace; font-size:8.5px; font-weight:700; letter-spacing:.03em; padding:1px 4px; border-radius:3px; color:#fff; z-index:2; line-height:1.4; }
  .io-badge.input{ background:var(--sage); }
  .io-badge.output{ background:var(--stamp); }
  .io-pill{ display:inline-flex; align-items:center; font-family:'IBM Plex Mono','Courier New',monospace; font-size:10px; font-weight:700; letter-spacing:.04em; padding:2px 7px; border-radius:3px; color:#fff; }
  .io-pill.input{ background:var(--sage); }
  .io-pill.output{ background:var(--stamp); }
  .io-choice{ display:flex; gap:8px; }
  .io-choice label{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:9px; border:1px solid var(--line); border-radius:5px; font-size:12.5px; color:var(--ink-soft); cursor:pointer; }
  .io-choice input{ display:none; }
  .io-choice input:checked + span{ color:inherit; }
  .io-choice label:has(input:checked){ border-color:var(--ink); background:var(--paper-dark); color:var(--ink); font-weight:600; }

  /* archive */
  .search-bar{ display:flex; align-items:center; gap:8px; padding:9px 12px; background:var(--card); border:1px solid var(--line); border-radius:6px; margin-bottom:14px; }
  .search-bar input{ border:none; outline:none; background:transparent; width:100%; font-size:13.5px; }
  .tag-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; }
  .chip{ font-size:11.5px; padding:3px 10px; border-radius:99px; border:1px solid var(--line); color:var(--ink-soft); }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
  .chip.active.tag{ background:var(--sage); border-color:var(--sage); }

  .card-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:14px; }
  .idx-card{ position:relative; text-align:left; width:100%; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:4px; box-shadow:0 1px 2px rgba(59,50,41,.06); transition:transform .12s; }
  .idx-card:hover{ transform:translateY(-2px); }
  .idx-card::after{ content:''; position:absolute; top:0; right:0; width:0; height:0; border-style:solid; border-width:0 20px 20px 0; border-color:transparent var(--fold) transparent transparent; }
  .idx-thumb{ aspect-ratio:4/3; background:var(--paper-dark); overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); }
  .idx-thumb img{ width:100%; height:100%; object-fit:cover; }
  .idx-body{ padding:11px; }
  .idx-note{ font-size:13px; line-height:1.5; min-height:38px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .idx-note.empty{ color:var(--ink-soft); }
  .idx-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .idx-rep{ font-family:'IBM Plex Mono','Courier New',monospace; font-size:9.5px; color:var(--stamp); letter-spacing:.03em; margin-bottom:5px; display:inline-block; }

  .stamp{ font-family:'IBM Plex Mono','Courier New',monospace; font-size:11px; letter-spacing:.06em; color:var(--stamp); border:1.5px solid var(--stamp); border-radius:3px; padding:2px 7px; display:inline-block; transform:rotate(-6deg); background:rgba(176,81,47,.05); white-space:nowrap; }

  .empty-state{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:80px 20px; text-align:center; color:var(--ink-soft); }
  .empty-state p{ font-size:13.5px; margin-top:10px; max-width:280px; }

  /* modal */
  .overlay{ position:fixed; inset:0; background:rgba(59,50,41,.45); display:flex; align-items:center; justify-content:center; padding:16px; z-index:50; }
  .modal{ position:relative; width:100%; max-width:420px; max-height:88vh; overflow:hidden; background:var(--card); border-radius:8px; box-shadow:0 12px 40px rgba(59,50,41,.25); display:flex; flex-direction:column; }
  .modal.wide{ max-width:480px; }
  .modal-close{ position:absolute; top:10px; right:10px; z-index:5; background:rgba(255,253,248,.85); border-radius:6px; padding:5px; color:var(--ink-soft); }
  .modal-scroll{ overflow-y:auto; }
  .modal-pad{ padding:20px; }

  label.field-label{ display:block; font-family:'IBM Plex Mono','Courier New',monospace; font-size:11px; color:var(--ink-soft); letter-spacing:.05em; margin-bottom:5px; }
  .field{ margin-bottom:16px; }
  .field-sub{ font-size:11px; color:var(--sage); margin-top:2px; display:block; }
  .field input[type=text], .field input[type=date], .field input[type=number], .field textarea, .field select{
    width:100%; padding:9px 11px; background:var(--paper); border:1px solid var(--line); border-radius:4px; outline:none; font-size:13.5px;
  }
  .field textarea{ resize:none; line-height:1.6; }
  .field-row{ display:flex; gap:10px; }
  .field-row > .field{ flex:1; min-width:0; }
  .dropzone{ margin-top:2px; min-height:140px; border:1.5px dashed var(--line); border-radius:6px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; overflow:hidden; text-align:center; color:var(--ink-soft); }
  .dropzone.drag{ border-color:var(--sage); background:rgba(116,128,89,.06); }
  .dropzone img{ max-height:220px; width:100%; object-fit:contain; }
  .dropzone .hint{ padding:28px 16px; font-size:12.5px; display:flex; flex-direction:column; align-items:center; gap:8px; }
  .remove-img{ margin-top:6px; font-size:12px; color:var(--danger); }

  .form-actions{ display:flex; justify-content:flex-end; gap:8px; padding-top:4px; }
  .btn-plain{ padding:8px 14px; font-size:13px; color:var(--ink-soft); }
  .btn-dark{ padding:8px 14px; font-size:13px; color:#fff; background:var(--ink); border-radius:4px; }
  .btn-dark:disabled{ opacity:.4; }

  .tag-pill{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; color:var(--sage); background:rgba(116,128,89,.12); border-radius:99px; padding:3px 9px; margin:0 6px 6px 0; }
  .chip-pill{ display:inline-flex; align-items:center; font-size:11px; color:var(--ink); background:var(--paper-dark); border-radius:99px; padding:3px 9px; margin:0 6px 6px 0; }

  .detail-actions{ display:flex; align-items:center; gap:2px; }
  .detail-note{ margin-top:16px; font-size:14.5px; line-height:1.75; white-space:pre-wrap; }
  .confirm-box{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(59,50,41,.55); }
  .confirm-card{ background:var(--card); border-radius:6px; padding:18px; width:100%; max-width:260px; }

  .spinner{ width:20px; height:20px; border:2px solid var(--line); border-top-color:var(--ink-soft); border-radius:50%; animation:spin .8s linear infinite; margin:60px auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .toast{ position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:12.5px; padding:9px 16px; border-radius:6px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:100; }
  .toast.show{ opacity:1; }

  .menu-pop{ position:absolute; right:0; top:calc(100% + 6px); background:var(--card); border:1px solid var(--line); border-radius:6px; box-shadow:0 6px 20px rgba(59,50,41,.15); min-width:190px; overflow:hidden; z-index:20; }
  .menu-pop button{ display:flex; align-items:center; gap:8px; width:100%; padding:10px 13px; font-size:13px; text-align:left; }
  .menu-pop button:hover{ background:var(--paper); }
  .menu-wrap{ position:relative; }

  .daylist-item{ display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:9px; border:1px solid var(--line); border-radius:6px; margin-bottom:8px; background:var(--card); }
  .daylist-item:hover{ border-color:var(--sage); }
  .daylist-thumb{ width:42px; height:42px; border-radius:4px; overflow:hidden; background:var(--paper-dark); flex-shrink:0; display:flex; align-items:center; justify-content:center; color:var(--ink-soft); font-size:15px; }
  .daylist-thumb img{ width:100%; height:100%; object-fit:cover; }
  .daylist-note{ font-size:12.5px; line-height:1.4; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink); }
  .daylist-note.empty{ color:var(--ink-soft); }
  .daylist-rep{ font-size:9px; color:var(--stamp); border:1px solid var(--stamp); border-radius:3px; padding:1px 5px; margin-top:3px; display:inline-block; }
  .daylist-add{ display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:11px; border:1.5px dashed var(--line); border-radius:6px; color:var(--ink-soft); font-size:12.5px; margin-top:4px; }
  .daylist-add:hover{ border-color:var(--sage); color:var(--sage); }

  .checkbox-row{ display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink); }
  .checkbox-row input{ width:15px; height:15px; accent-color:var(--stamp); }
  .checkbox-hint{ font-size:11.5px; color:var(--ink-soft); line-height:1.5; }

  /* diary */
  .diary-group{ margin-bottom:6px; }
  .diary-year-head{ display:flex; align-items:center; gap:8px; width:100%; padding:12px 4px; border-bottom:1px solid var(--line); }
  .diary-year-head .chev{ transition:transform .15s; color:var(--ink-soft); font-size:11px; }
  .diary-year-head.open .chev{ transform:rotate(90deg); }
  .diary-year-head .y{ font-family:Georgia,'Noto Serif KR',serif; font-size:18px; font-weight:700; }
  .diary-year-head .count{ font-size:11px; color:var(--ink-soft); margin-left:auto; }
  .diary-month-head{ display:flex; align-items:center; gap:8px; width:100%; padding:10px 4px 10px 20px; }
  .diary-month-head .chev{ transition:transform .15s; color:var(--ink-soft); font-size:10px; }
  .diary-month-head.open .chev{ transform:rotate(90deg); }
  .diary-month-head .m{ font-family:'IBM Plex Mono','Courier New',monospace; font-size:12.5px; color:var(--ink); }
  .diary-month-head .count{ font-size:10.5px; color:var(--ink-soft); margin-left:auto; }
  .diary-entry-row{ display:block; width:100%; text-align:left; padding:10px 12px 10px 34px; border-bottom:1px solid var(--paper-dark); }
  .diary-entry-row:hover{ background:var(--card); }
  .diary-entry-date{ font-family:'IBM Plex Mono','Courier New',monospace; font-size:10.5px; color:var(--stamp); }
  .diary-entry-preview{ font-size:13px; color:var(--ink); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .diary-stat-row{ display:flex; flex-wrap:wrap; gap:6px; margin:14px 0; }
  .diary-qa{ margin-bottom:16px; }
  .diary-qa .ql{ font-size:12px; color:var(--sage); font-weight:600; line-height:1.5; }
  .diary-qa .qa-text{ font-size:14px; color:var(--ink); line-height:1.7; margin-top:5px; white-space:pre-wrap; }

  /* principles */
  .principles-box{ background:var(--card); border:1px solid var(--line); border-radius:8px; padding:34px 28px; box-shadow:0 2px 10px rgba(59,50,41,.06); position:relative; }
  .principles-head{ text-align:center; margin-bottom:20px; }
  .principles-head .title1{ font-family:Georgia,'Noto Serif KR',serif; font-size:24px; letter-spacing:.06em; font-weight:700; }
  .principles-head .title2{ font-family:Georgia,'Noto Serif KR',serif; font-size:15px; color:var(--ink-soft); letter-spacing:.2em; margin-top:4px; }
  .principles-rule{ width:64px; height:2px; background:var(--stamp); margin:16px auto 0; }
  .principles-body{ font-family:Georgia,'Noto Serif KR',serif; font-size:15.5px; line-height:2; color:var(--ink); text-align:justify; }
  .principles-body p{ margin:0 0 18px; }
  .principles-edit-btn{ position:absolute; top:16px; right:16px; }
  .principles-textarea{ width:100%; min-height:320px; padding:16px; background:var(--paper); border:1px solid var(--line); border-radius:6px; font-family:Georgia,'Noto Serif KR',serif; font-size:14.5px; line-height:1.8; resize:vertical; outline:none; }

  /* quest embed */
  .quest-embed{ border-radius:8px; overflow:hidden; border:1px solid var(--line); background:#0f0e1a; }
  .quest-embed iframe{ width:100%; height:78vh; border:none; display:block; }
  .quest-embed-note{ font-size:11.5px; color:var(--ink-soft); text-align:center; margin-top:10px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------------------------------------------------------------- */
/* IndexedDB layer (generic, multi-store)                            */
/* ---------------------------------------------------------------- */
const DB_NAME = 'referenceArchiveDB';
const DB_VERSION = 2;
const STORES = ['entries', 'diary', 'principles'];
let dbPromise = null;

function openDB(){
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains('entries')) {
        const os = db.createObjectStore('entries', { keyPath: 'id' });
        os.createIndex('date', 'date', { unique: false });
      }
      if (!db.objectStoreNames.contains('diary')) {
        const os2 = db.createObjectStore('diary', { keyPath: 'id' });
        os2.createIndex('date', 'date', { unique: false });
      }
      if (!db.objectStoreNames.contains('principles')) {
        db.createObjectStore('principles', { keyPath: 'id' });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}
async function dbPut(store, obj){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbDelete(store, id){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGetAll(store){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}
async function dbGet(store, id){
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

/* ---------------------------------------------------------------- */
/* Constants & helpers                                                */
/* ---------------------------------------------------------------- */
const MONTH_NAMES = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const WEEKDAYS = ['MON','TUE','WED','THU','FRI','SAT','SUN'];
const WEATHER_OPTS = ['☀️ 맑음','⛅ 구름조금','☁️ 흐림','🌧️ 비','❄️ 눈','🌬️ 바람'];
const SCALE_OPTS = ['1 · 아주 나쁨','2 · 나쁨','3 · 보통','4 · 좋음','5 · 아주 좋음'];
const MOOD_OPTS = ['😢 매우 안좋음','🙁 안좋음','😐 보통','🙂 좋음','😀 매우 좋음'];
const QUESTIONS = [
  { key:'q1', label:'1. 새로 깨달은 것은 무엇인가, 어떤 상황에서 깨달았나, 무엇이 도움을 주었나?', sub:'이성적 측면' },
  { key:'q2', label:'2. 무슨 일이 일어나는 중에 무엇을 보았고 나는 무엇을 느꼈는가, 어떤 의미가 있다고 생각하는가?', sub:'감성적 측면' },
  { key:'q3', label:'3. 즐겁거나 좋았던 것 / 아쉬웠던 것은?', sub:'' },
  { key:'q4', label:'4. 달라졌거나, 달라질 것 같은 것이 있다면 무엇인가?', sub:'' },
];

const pad = n => String(n).padStart(2,'0');
const toDateKey = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const todayKey = () => { const t = new Date(); return toDateKey(t.getFullYear(), t.getMonth(), t.getDate()); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function resizeImage(file, maxW, quality){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('read failed'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('decode failed'));
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function stampLabel(dateStr){
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d)) return dateStr;
  return `${MONTH_NAMES[d.getMonth()].slice(0,3)} ${pad(d.getDate())}`;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
function renderChipList(str){
  const parts = (str||'').split(',').map(s=>s.trim()).filter(Boolean);
  if (!parts.length) return '<span style="color:var(--ink-soft);font-size:12.5px;">없음</span>';
  return parts.map(p => `<span class="chip-pill">${esc(p)}</span>`).join('');
}

/* App state                                                          */
/* ---------------------------------------------------------------- */
const state = {
  view: 'calendar', // calendar | archive | diary | quest | principles
  entries: [],
  diary: [],
  principlesText: '',
  loading: true,
  cursor: (() => { const t = new Date(); return { year: t.getFullYear(), month: t.getMonth() }; })(),
  query: '',
  activeTag: null,
  modal: null,
  pendingImage: null,
  menuOpen: false,
  diaryExpanded: null, // init on first load
  principlesEditing: false,
};

async function refresh(){
  const [entries, diary, principlesList] = await Promise.all([
    dbGetAll('entries'), dbGetAll('diary'), dbGetAll('principles'),
  ]);
  state.entries = entries.sort((a,b) => a.date < b.date ? 1 : -1);
  state.diary = diary.sort((a,b) => a.date < b.date ? 1 : -1);
  const p = principlesList.find(x => x.id === 'main');
  state.principlesText = p ? p.text : '';

  if (state.diaryExpanded === null){
    const t = new Date();
    state.diaryExpanded = {};
    state.diaryExpanded['y-' + t.getFullYear()] = true;
    state.diaryExpanded['m-' + t.getFullYear() + '-' + pad(t.getMonth()+1)] = true;
  }
  state.loading = false;
  render();
}

async function ensureRepresentative(date){
  const list = (await dbGetAll('entries')).filter(e => e.date === date);
  if (list.length === 0) return;
  if (!list.some(e => e.isRep)){
    list.sort((a,b) => (a.updatedAt||0) - (b.updatedAt||0));
    await dbPut('entries', { ...list[0], isRep: true });
  }
}

/* ---------------------------------------------------------------- */
/* Calendar                                                           */
/* ---------------------------------------------------------------- */
function calendarHTML(){
  const { year, month } = state.cursor;
  const firstOfMonth = new Date(year, month, 1);
  const startOffset = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const byDate = {};
  state.entries.forEach(it => { (byDate[it.date] ||= []).push(it); });
  const tKey = todayKey();

  let cells = '';
  for (let i=0;i<startOffset;i++) cells += `<div></div>`;
  for (let d=1; d<=daysInMonth; d++){
    const key = toDateKey(year, month, d);
    const items = byDate[key];
    const rep = items ? (items.find(x => x.isRep) || items[0]) : null;
    const isToday = key === tKey;
    const cls = ['cal-cell', items ? 'has-entry':'', isToday ? 'today':''].join(' ').trim();
    let inner = `<span class="d">${pad(d)}</span>`;
    if (rep && rep.thumb){
      inner += `<div class="cal-thumb"><img src="${rep.thumb}" alt=""/></div>`;
    } else if (items){
      inner += `<div class="cal-dot"><span></span></div>`;
    }
    if (rep && rep.kind){
      inner += `<span class="io-badge ${rep.kind}" style="top:2px;right:2px;">${rep.kind==='input'?'IN':'OUT'}</span>`;
    }
    if (items && items.length > 1){
      inner += `<span class="cal-more">+${items.length-1}</span>`;
    }
    cells += `<button class="${cls}" data-act="day" data-date="${key}">${inner}</button>`;
  }

  return `
    <div class="cal-head">
      <button class="btn-ghost" data-act="prev-month">‹</button>
      <h2 class="serif">${MONTH_NAMES[month]} <em>${year}</em></h2>
      <button class="btn-ghost" data-act="next-month">›</button>
    </div>
    <div class="cal-grid">
      ${WEEKDAYS.map(w => `<div class="cal-dow mono">${w}</div>`).join('')}
      ${cells}
    </div>
  `;
}

  });
  return `
  <div class="overlay" data-act="overlay-close">
    <div class="modal" data-stop>

/* ---------------------------------------------------------------- */
/* Archive                                                            */
/* ---------------------------------------------------------------- */
function archiveHTML(){
  const allTags = Array.from(new Set(state.entries.flatMap(e => e.tags||[]))).slice(0,14);
  const q = state.query.trim().toLowerCase();
  const filtered = state.entries.filter(it => {
    if (state.activeTag && !(it.tags||[]).includes(state.activeTag)) return false;
    if (q){
      const hay = `${it.note} ${(it.tags||[]).join(' ')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });

  const tagsRow = allTags.length ? `
    <div class="tag-row">
      <button class="chip ${state.activeTag===null?'active':''}" data-act="filter-tag" data-tag="">전체</button>
      ${allTags.map(t => `<button class="chip tag ${state.activeTag===t?'active':''}" data-act="filter-tag" data-tag="${esc(t)}">#${esc(t)}</button>`).join('')}
    </div>` : '';

  const grid = filtered.length === 0 ? `
    <div class="empty-state">
      <div style="font-size:22px;">🗂️</div>
      <p>${state.entries.length===0 ? '아직 저장된 자료가 없어요. 오늘의 인풋부터 기록해보세요.' : '조건에 맞는 기록이 없어요.'}</p>
    </div>` : `
    <div class="card-grid">
      ${filtered.map(cardHTML).join('')}
    </div>`;

  return `
    <div class="search-bar">
      🔍 <input id="searchInput" type="text" placeholder="메모, 태그로 검색" value="${esc(state.query)}"/>
    </div>
    ${tagsRow}
    ${grid}
  `;
}

function cardHTML(it){
  const noteHTML = it.note ? esc(it.note) : '<span style="color:var(--ink-soft)">메모 없음</span>';
  const extraTag = it.tags && it.tags.length ? `<span class="mono" style="font-size:11px;color:var(--ink-soft)">#${esc(it.tags[0])}${it.tags.length>1?` +${it.tags.length-1}`:''}</span>` : '<span></span>';
  return `
    <button class="idx-card" data-act="open" data-id="${it.id}">
      <div class="idx-thumb">${it.thumb ? `<img src="${it.thumb}" alt=""/>` : '🖼'}</div>
      ${it.kind ? `<span class="io-badge ${it.kind}" style="top:8px;left:8px;">${it.kind==='input'?'IN':'OUT'}</span>` : ''}
      <div class="idx-body">
        ${it.isRep ? `<span class="idx-rep">★ 대표 메모</span>` : ''}
        <div class="idx-note ${it.note?'':'empty'}">${noteHTML}</div>
        <div class="idx-foot">
          <span class="stamp">${stampLabel(it.date)}</span>
          ${extraTag}
        </div>
      </div>
    </button>`;
}

function diaryHTML(){
  if (state.diary.length === 0){
    return `
    <div class="empty-state">
      <div style="font-size:22px;">📖</div>
      <p>아직 쓴 일기가 없어요. 오늘 하루를 기록해보세요.</p>
    </div>`;
  }
  const groups = {};
  state.diary.forEach(d => {
    const y = d.date.slice(0,4);
    const m = d.date.slice(5,7);
    (groups[y] ||= {});
    (groups[y][m] ||= []).push(d);
  });
  const years = Object.keys(groups).sort((a,b) => b.localeCompare(a));

  let html = '';
  years.forEach(y => {
    const yOpen = !!state.diaryExpanded['y-' + y];
    const yCount = Object.values(groups[y]).reduce((s,a) => s + a.length, 0);
    html += `<div class="diary-group">
      <button class="diary-year-head ${yOpen?'open':''}" data-act="toggle-year" data-year="${y}">
        <span class="chev">▶</span><span class="y">${y}</span><span class="count mono">${yCount}건</span>
      </button>`;
    if (yOpen){
      const months = Object.keys(groups[y]).sort((a,b) => b.localeCompare(a));
      months.forEach(m => {
        const key = 'm-' + y + '-' + m;
        const mOpen = !!state.diaryExpanded[key];
        const list = groups[y][m].sort((a,b) => a.date < b.date ? 1 : -1);
        html += `<button class="diary-month-head ${mOpen?'open':''}" data-act="toggle-month" data-ym="${y}-${m}">
          <span class="chev">▶</span><span class="m">${m}월</span><span class="count">${list.length}건</span>
        </button>`;
        if (mOpen){
          list.forEach(d => {
            const preview = d.q1 || d.inputKw || '기록 없음';
            html += `<button class="diary-entry-row" data-act="open-diary" data-id="${d.id}">
              <div class="diary-entry-date">${d.date}</div>
              <div class="diary-entry-preview">${esc(preview)}</div>
            </button>`;
          });
        }
      });
    }
    html += `</div>`;
  });
  return html;
}

            <span class="stamp">${stampLabel(d.date)}</span>
            <div class="detail-actions">
              <button class="btn-ghost" data-act="edit-diary">✎</button>
              <button class="btn-ghost" style="color:var(--danger)" data-act="ask-delete-diary">🗑</button>
            </div>
          </div>

          <div style="margin-top:16px;">
            <label class="field-label mono">INPUT</label>
            <div>${renderChipList(d.inputKw)}</div>
          </div>
          <div style="margin-top:10px;">
            <label class="field-label mono">OUTPUT</label>
            <div>${renderChipList(d.outputKw)}</div>
          </div>

          <div class="diary-stat-row">
            ${statChip('🌤', d.weather)}
            ${statChip('🌡', d.temp ? d.temp + '°C' : '')}
            ${statChip('😴', d.sleep)}
            ${statChip('💪', d.condition)}
            ${statChip('🙂', d.mood)}
          </div>

          ${QUESTIONS.map(q => d[q.key] ? `
            <div class="diary-qa">
              <div class="ql">${esc(q.label)}</div>
              <div class="qa-text">${esc(d[q.key])}</div>
            </div>` : '').join('')}
        </div>
      </div>
      ${confirmDeleteDiaryOpen ? `
      <div class="confirm-box">
        <div class="confirm-card">
          <p style="font-size:13.5px;margin:0 0 14px;">이 일기를 삭제할까요? 되돌릴 수 없어요.</p>
          <div style="display:flex;justify-content:flex-end;gap:8px;">
            <button class="btn-plain" data-act="cancel-delete-diary">취소</button>
            <button class="btn-dark" style="background:var(--danger)" data-act="confirm-delete-diary">삭제</button>
          </div>
        </div>
      </div>` : ''}
    </div>
  </div>`;
}

/* ---------------------------------------------------------------- */
/* Quest log (embedded)                                               */
/* ---------------------------------------------------------------- */
function questHTML(){
  return `
    <div class="quest-embed">
      <iframe src="pixel-quest-log.html" title="Pixel Quest Log"></iframe>
    </div>
    <p class="quest-embed-note">퀘스트로그는 자체 화면·저장 방식을 그대로 유지해요. 데이터는 이 기기의 브라우저에 별도로 저장돼요.</p>
  `;
}

/* ---------------------------------------------------------------- */
/* Principles                                                         */
/* ---------------------------------------------------------------- */
function principlesHTML(){
  if (state.principlesEditing){
    return `
      <div class="principles-box">
        <textarea class="principles-textarea" id="principlesTextarea" placeholder="나만의 행동 원칙을 적어보세요. 문단은 빈 줄로 구분돼요.">${esc(state.principlesText)}</textarea>
        <div class="form-actions" style="margin-top:14px;">
          <button class="btn-plain" data-act="principles-cancel">취소</button>
          <button class="btn-dark" data-act="principles-save">저장</button>
        </div>
      </div>`;
  }
  const paragraphs = state.principlesText.trim()
    ? state.principlesText.trim().split(/\n\s*\n/).map(p => `<p>${esc(p).replace(/\n/g,'<br/>')}</p>`).join('')
    : `<p style="color:var(--ink-soft);text-align:center;">아직 작성된 원칙이 없어요. 편집을 눌러 나만의 행동 원칙을 적어보세요.</p>`;

  return `
    <div class="principles-box">
      <button class="btn-ghost principles-edit-btn" data-act="principles-edit">✎ 편집</button>
      <div class="principles-head">
        <div class="title1">PRINCIPLES</div>
        <div class="title2">행동 원칙</div>
        <div class="principles-rule"></div>
      </div>
      <div class="principles-body">${paragraphs}</div>
    </div>`;
}

/* ---------------------------------------------------------------- */
/* Event binding                                                      */
/* ---------------------------------------------------------------- */
function bindEvents(){
  app.querySelectorAll('[data-act]').forEach(el => {
    el.addEventListener('click', onAction);
  });
  const search = document.getElementById('searchInput');
  if (search){
    search.addEventListener('input', (e) => { state.query = e.target.value; render(); preserveFocus(search); });
  }
  const form = document.getElementById('entryForm');
  if (form) form.addEventListener('submit', onSaveForm);
  const diaryForm = document.getElementById('diaryForm');
  if (diaryForm) diaryForm.addEventListener('submit', onSaveDiaryForm);

  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('fileInput');
  if (dropzone){
    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault(); dropzone.classList.remove('drag');
      handleFile(e.dataTransfer.files[0]);
    });
  }
  if (fileInput) fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));
  document.addEventListener('paste', onPasteGlobal);
}

function preserveFocus(el){ el.focus(); const v = el.value; el.value=''; el.value=v; }

async function onAction(e){
  const act = e.currentTarget.dataset.act;
  switch(act){
    case 'switch-view': state.view = e.currentTarget.dataset.view; state.menuOpen=false; render(); break;
    case 'prev-month': moveMonth(-1); break;
    case 'next-month': moveMonth(1); break;
    case 'day': {
      const date = e.currentTarget.dataset.date;
      const items = state.entries.filter(it => it.date === date);
      if (items.length === 0) openForm({date});
      else if (items.length === 1) openDetail(items[0].id);
      else { state.modal = { type:'daylist', date }; render(); }
      break;
    }
    case 'daylist-add': openForm({ date: e.currentTarget.dataset.date }); break;
    case 'filter-tag': state.activeTag = e.currentTarget.dataset.tag || null; render(); break;
    case 'add': openForm(null); break;
    case 'open': openDetail(e.currentTarget.dataset.id); break;
    case 'close-modal': closeModal(); break;
    case 'overlay-close': if (e.target === e.currentTarget) closeModal(); break;
    case 'remove-image': state.pendingImage = {full:null, thumb:null}; render(); break;
    case 'edit-entry': openForm(detailEntry); break;
    case 'ask-delete': confirmDeleteOpen = true; render(); break;
    case 'cancel-delete': confirmDeleteOpen = false; render(); break;
    case 'confirm-delete': await doDeleteEntry(detailEntry.id); break;
    case 'toggle-menu': state.menuOpen = !state.menuOpen; render(); break;
    case 'export': doExport(); break;
    case 'import': doImportPrompt(); break;

    case 'add-diary': openDiaryForm(null); break;
    case 'open-diary': openDiaryDetail(e.currentTarget.dataset.id); break;
    case 'edit-diary': openDiaryForm(detailDiary); break;
    case 'ask-delete-diary': confirmDeleteDiaryOpen = true; render(); break;
    case 'cancel-delete-diary': confirmDeleteDiaryOpen = false; render(); break;
    case 'confirm-delete-diary': await doDeleteDiary(detailDiary.id); break;
    case 'toggle-year': {
      const key = 'y-' + e.currentTarget.dataset.year;
      state.diaryExpanded[key] = !state.diaryExpanded[key];
      render();
      break;
    }
    case 'toggle-month': {
      const key = 'm-' + e.currentTarget.dataset.ym;
      state.diaryExpanded[key] = !state.diaryExpanded[key];
      render();
      break;
    }

    case 'principles-edit': state.principlesEditing = true; render(); break;
    case 'principles-cancel': state.principlesEditing = false; render(); break;
    case 'principles-save': await savePrinciples(); break;
  }
}

function moveMonth(delta){
  let { year, month } = state.cursor;
  month += delta;
  if (month < 0){ month = 11; year -= 1; }
  if (month > 11){ month = 0; year += 1; }
  state.cursor = { year, month };
  render();
}

function openForm(initial){
  state.pendingImage = initial && initial.image ? { full: initial.image, thumb: initial.thumb } : null;
  state.modal = { type: 'form', initial };
  state.menuOpen = false;
  render();
}
async function openDetail(id){
  state.modal = { type: 'detail', id };
  detailEntry = null;
  confirmDeleteOpen = false;
  state.menuOpen = false;
  render();
  detailEntry = await dbGet('entries', id);
  render();
}
function openDiaryForm(initial){
  state.modal = { type: 'diaryForm', initial };
  state.menuOpen = false;
  render();
}
async function openDiaryDetail(id){
  state.modal = { type: 'diaryDetail', id };
  detailDiary = null;
  confirmDeleteDiaryOpen = false;
  state.menuOpen = false;
  render();
  detailDiary = await dbGet('diary', id);
  render();
}
function closeModal(){
  state.modal = null;
  state.pendingImage = null;
  detailEntry = null;
  confirmDeleteOpen = false;
  detailDiary = null;
  confirmDeleteDiaryOpen = false;
  render();
}

async function handleFile(file){
  if (!file || !file.type || !file.type.startsWith('image/')) return;
  try{
    const [full, thumb] = await Promise.all([resizeImage(file, 1200, 0.82), resizeImage(file, 260, 0.6)]);
    state.pendingImage = { full, thumb };
    render();
  }catch(err){ console.error(err); showToast('이미지를 불러오지 못했어요'); }
}
function onPasteGlobal(e){
  if (!state.modal || state.modal.type !== 'form') return;
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (const it of items){
    if (it.type && it.type.startsWith('image/')){
      handleFile(it.getAsFile());
      break;
    }
  }
}

async function onSaveForm(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const date = fd.get('date') || todayKey();
  const note = (fd.get('note') || '').trim();
  const tags = (fd.get('tags') || '').split(',').map(t=>t.trim()).filter(Boolean).slice(0,8);
  const isRep = fd.get('isRep') === 'on';
  const kind = fd.get('kind') || '';
  const initial = state.modal.initial;
  const id = (initial && initial.id) || uid();
  const image = state.pendingImage ? state.pendingImage.full : (initial ? initial.image : null);
  const thumb = state.pendingImage ? state.pendingImage.thumb : (initial ? initial.thumb : null);

  const entry = { id, date, note, tags, image: image||null, thumb: thumb||null, isRep, kind, updatedAt: Date.now() };
  await dbPut('entries', entry);

  if (isRep){
    const all = await dbGetAll('entries');
    const siblings = all.filter(x => x.date === date && x.id !== id && x.isRep);
    for (const s of siblings){ await dbPut('entries', { ...s, isRep:false }); }
  }

  closeModal();
  await refresh();
  await ensureRepresentative(date);
  await refresh();
  showToast('저장했어요');
}

async function doDeleteEntry(id){
  const date = detailEntry ? detailEntry.date : null;
  await dbDelete('entries', id);
  closeModal();
  await refresh();
  if (date){ await ensureRepresentative(date); await refresh(); }
  showToast('삭제했어요');
}

async function onSaveDiaryForm(e){
  e.preventDefault();
  const fd = new FormData(e.target);
  const initial = state.modal.initial;
  const id = (initial && initial.id) || uid();
  const entry = {
    id,
    date: fd.get('date') || todayKey(),
    inputKw: (fd.get('inputKw')||'').trim(),
    outputKw: (fd.get('outputKw')||'').trim(),
    weather: fd.get('weather') || '',
    temp: fd.get('temp') || '',
    sleep: fd.get('sleep') || '',
    condition: fd.get('condition') || '',
    mood: fd.get('mood') || '',
    q1: (fd.get('q1')||'').trim(),
    q2: (fd.get('q2')||'').trim(),
    q3: (fd.get('q3')||'').trim(),
    q4: (fd.get('q4')||'').trim(),
    updatedAt: Date.now(),
  };
  await dbPut('diary', entry);
  closeModal();
  await refresh();
  showToast('일기를 저장했어요');
}

async function doDeleteDiary(id){
  await dbDelete('diary', id);
  closeModal();
  await refresh();
  showToast('삭제했어요');
}

async function savePrinciples(){
  const ta = document.getElementById('principlesTextarea');
  const text = ta ? ta.value : state.principlesText;
  await dbPut('principles', { id:'main', text, updatedAt: Date.now() });
  state.principlesEditing = false;
  await refresh();
  showToast('원칙을 저장했어요');
}

async function doExport(){
  state.menuOpen = false;
  const [entries, diary, principles] = await Promise.all([
    dbGetAll('entries'), dbGetAll('diary'), dbGetAll('principles'),
  ]);
  const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), entries, diary, principles }, null, 0)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `reference-archive-backup-${todayKey()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('백업 파일을 저장했어요');
}

function doImportPrompt(){
  state.menuOpen = false;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'application/json';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    try{
      const text = await file.text();
      const parsed = JSON.parse(text);
      const entriesList = Array.isArray(parsed) ? parsed : (parsed.entries || []);
      const diaryList = Array.isArray(parsed) ? [] : (parsed.diary || []);
      const principlesList = Array.isArray(parsed) ? [] : (parsed.principles || []);
      let count = 0;
      for (const entry of entriesList){ if (entry && entry.id){ await dbPut('entries', entry); count++; } }
      for (const d of diaryList){ if (d && d.id){ await dbPut('diary', d); count++; } }
      for (const p of principlesList){ if (p && p.id){ await dbPut('principles', p); count++; } }
      await refresh();
      showToast(`${count}건 가져왔어요`);
    }catch(err){
      console.error(err);
      showToast('백업 파일을 읽지 못했어요');
    }
  };
  input.click();
}

/* ---------------------------------------------------------------- */
/* Init                                                                */
/* ---------------------------------------------------------------- */
render();
refresh();

if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
