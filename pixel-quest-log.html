<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PIXEL QUEST LOG</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css');

:root{
  --bg:#0f0e1a;
  --bg-glow1:#201f3a;
  --bg-glow2:#1a1930;
  --panel:#1b1a2e;
  --card:#242440;
  --card-hover:#2b2a4d;
  --border:#3d3a5c;
  --border-light:#5a5488;
  --gold:#ffcd3c;
  --gold-dark:#b8901a;
  --cyan:#5fd9c9;
  --cyan-dark:#2f8f82;
  --red:#ff5d73;
  --red-dark:#a33648;
  --green:#7ee27e;
  --text:#eae6ff;
  --text-dim:#8b86b3;
  --input-bg:#12111f;
  --scanline-opacity:0.15;
  --shadow:#000000;
}

/* ---------- theme variants ---------- */

/* 2. 정원 - 라이트모드, 채도낮은 아이보리+베이지+녹색 */
html[data-theme="garden"]{
  --bg:#f2ede1;
  --bg-glow1:#e8dfc9;
  --bg-glow2:#dfe6d3;
  --panel:#ece4d2;
  --card:#e2d8c1;
  --card-hover:#d7cbaf;
  --border:#c1b493;
  --border-light:#96895f;
  --gold:#7c9459;
  --gold-dark:#5a7040;
  --cyan:#8fa77f;
  --cyan-dark:#6a8760;
  --red:#bd6f4e;
  --red-dark:#8f5136;
  --green:#6a8f4f;
  --text:#3d3728;
  --text-dim:#8c8168;
  --input-bg:#e7ddc6;
  --scanline-opacity:0.05;
  --shadow:#000000;
}

/* 3. 한여름 초록 - 라이트모드, 명도높은 그레이+화이트 베이스 + 연두 포인트 (청록감 완화) */
html[data-theme="summer"]{
  --bg:#f5f7f5;
  --bg-glow1:#e9f1e7;
  --bg-glow2:#eef2f0;
  --panel:#ffffff;
  --card:#f0f4ef;
  --card-hover:#e6ede4;
  --border:#d6ded6;
  --border-light:#aebfa9;
  --gold:#7cbb54;
  --gold-dark:#568c39;
  --cyan:#a3b3a9;
  --cyan-dark:#7c8f82;
  --red:#e0705f;
  --red-dark:#ac4f41;
  --green:#a8d97a;
  --text:#333c35;
  --text-dim:#87938a;
  --input-bg:#edf2ec;
  --scanline-opacity:0.05;
  --shadow:#000000;
}

/* 4. 베이지헤븐 - 인스타 유행 베이지 인테리어 톤 */
html[data-theme="beige"]{
  --bg:#ece2ce;
  --bg-glow1:#e2d3b4;
  --bg-glow2:#f1e8d7;
  --panel:#e6d9c1;
  --card:#dccdac;
  --card-hover:#d0bf9a;
  --border:#b89f78;
  --border-light:#96794f;
  --gold:#a3764a;
  --gold-dark:#79552f;
  --cyan:#b58f72;
  --cyan-dark:#8a6a51;
  --red:#ad6349;
  --red-dark:#824632;
  --green:#8d9770;
  --text:#453824;
  --text-dim:#93805f;
  --input-bg:#e1d3b8;
  --scanline-opacity:0.05;
  --shadow:#000000;
}

/* 5. 레트로 오렌지 - 라이트모드, 주황+블랙+화이트, Braun 제품디자인 느낌 */
html[data-theme="retro"]{
  --bg:#f5f2ec;
  --bg-glow1:#f2ddc7;
  --bg-glow2:#ece7db;
  --panel:#ffffff;
  --card:#f1ede3;
  --card-hover:#e8e0cf;
  --border:#1a1a1a;
  --border-light:#000000;
  --gold:#ff6a1a;
  --gold-dark:#cc5314;
  --cyan:#333333;
  --cyan-dark:#000000;
  --red:#d6431f;
  --red-dark:#a3341a;
  --green:#1a1a1a;
  --text:#1a1a1a;
  --text-dim:#7d7669;
  --input-bg:#eeeae0;
  --scanline-opacity:0.05;
  --shadow:#000000;
}

/* 6. 게임룸 - 다크모드, 미국식 노스텔지어. 레트로 오렌지처럼 '중립 베이스 + 강한 포인트 1색' 구조로 재설계 */
html[data-theme="gameroom"]{
  --bg:#1c1712;
  --bg-glow1:#2a2018;
  --bg-glow2:#181c22;
  --panel:#241d16;
  --card:#2d2419;
  --card-hover:#372c1e;
  --border:#4a3c2c;
  --border-light:#6b5a41;
  --gold:#e8433f;
  --gold-dark:#a82e2b;
  --cyan:#3d6a99;
  --cyan-dark:#294a70;
  --red:#ff5c52;
  --red-dark:#b03c34;
  --green:#f2ead2;
  --text:#f2ead2;
  --text-dim:#a3927a;
  --input-bg:#15110c;
  --scanline-opacity:0.15;
  --shadow:#000000;
}

*{box-sizing:border-box;}

body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 20% 10%, var(--bg-glow1) 0%, transparent 40%),
    radial-gradient(circle at 80% 90%, var(--bg-glow2) 0%, transparent 40%),
    var(--bg);
  font-family:'Galmuri11','Galmuri9',monospace;
  color:var(--text);
  padding:24px 12px 60px;
  image-rendering:pixelated;
  transition:background-color .2s;
}

/* ---------- pixel frame helper ---------- */
.pixel-panel{
  position:relative;
  background:var(--panel);
  border:3px solid var(--border-light);
  clip-path:polygon(
    0 8px, 8px 8px, 8px 0,
    calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
    100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
    8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
  );
  box-shadow: 0 6px 0 0 #000000aa, inset 0 0 0 3px #0000004d;
  padding:16px;
}

.pixel-btn{
  font-family:'Galmuri11',monospace;
  font-size:12px;
  color:var(--bg);
  background:var(--gold);
  border:none;
  padding:8px 12px;
  cursor:pointer;
  clip-path:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));
  box-shadow:0 4px 0 var(--gold-dark);
  transition:transform .05s;
  white-space:nowrap;
}
.pixel-btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--gold-dark);}
.pixel-btn.secondary{background:var(--cyan);box-shadow:0 4px 0 var(--cyan-dark);}
.pixel-btn.secondary:active{box-shadow:0 0 0 var(--cyan-dark);}
.pixel-btn.danger{background:var(--red);box-shadow:0 4px 0 var(--red-dark);color:#fff;}
.pixel-btn.danger:active{box-shadow:0 0 0 var(--red-dark);}
.pixel-btn:disabled{opacity:.35;cursor:default;}

input.pixel-input{
  font-family:'Galmuri11',monospace;
  font-size:12px;
  background:var(--input-bg);
  border:2px solid var(--border);
  color:var(--text);
  padding:8px 10px;
  outline:none;
}
input.pixel-input:focus{border-color:var(--cyan);}

/* scanline overlay */
.crt::after{
  content:"";
  position:absolute;inset:0;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,var(--scanline-opacity)) 0px, rgba(0,0,0,var(--scanline-opacity)) 1px, transparent 1px, transparent 3px);
  pointer-events:none;
}

/* ---------- layout ---------- */
.game-frame{
  max-width:720px;
  margin:0 auto;
  display:flex;
  flex-direction:column;
  gap:18px;
}

.topbar{
  text-align:center;
  padding:18px 10px;
}
.logo{
  font-size:20px;
  margin:0;
  color:var(--gold);
  text-shadow:3px 3px 0 #000;
  letter-spacing:2px;
}
.date-display{
  margin-top:8px;
  font-size:11px;
  color:var(--text-dim);
}

.theme-picker{
  display:flex;
  justify-content:center;
  gap:8px;
  margin-top:14px;
  flex-wrap:wrap;
}
.theme-swatch{
  width:26px;height:26px;
  border:2px solid var(--border);
  cursor:pointer;
  padding:0;
  position:relative;
  flex-shrink:0;
}
.theme-swatch:hover{border-color:var(--border-light);}
.theme-swatch.active{border-color:var(--gold);box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--gold);}
.theme-swatch span{
  position:absolute;inset:2px;
  display:block;
}

/* exp panel */
.exp-panel{position:relative;}
.exp-top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:6px;}
.exp-label{font-size:11px;color:var(--cyan);letter-spacing:1px;}
.streak-badge{
  font-size:11px;
  background:var(--input-bg);
  border:2px solid var(--border);
  padding:4px 8px;
  color:var(--gold);
}
.bar-outer{
  height:22px;
  background:var(--input-bg);
  border:2px solid var(--border);
  position:relative;
  overflow:hidden;
}
.bar-inner{
  height:100%;
  width:0%;
  background:repeating-linear-gradient(90deg, var(--cyan) 0 6px, var(--cyan-dark) 6px 8px);
  transition:width .35s steps(20);
}
.bar-inner.gold{background:repeating-linear-gradient(90deg, var(--gold) 0 6px, var(--gold-dark) 6px 8px);}
.bar-text{
  margin-top:6px;
  font-size:11px;
  color:var(--text-dim);
  text-align:right;
}

/* quest board */
.board-title{font-size:12px;color:var(--gold);margin:0 0 12px;letter-spacing:1px;}
.add-quest-row{display:flex;gap:8px;margin-bottom:14px;}
.add-quest-row input{flex:1;}

.quest-list{display:flex;flex-direction:column;gap:12px;}

.quest-card{
  background:var(--card);
  border:2px solid var(--border);
  padding:12px;
  position:relative;
}
.quest-card.cleared{border-color:var(--green);}
.quest-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:8px;
  margin-bottom:8px;
}
.quest-title{font-size:13px;line-height:1.4;word-break:break-all;}
.quest-title.done{color:var(--green);}
.clear-stamp{
  font-size:9px;
  color:var(--bg);
  background:var(--green);
  padding:2px 6px;
  margin-left:6px;
  display:inline-block;
  transform:rotate(-4deg);
  vertical-align:middle;
}
.icon-btn{
  background:none;
  border:none;
  color:var(--text-dim);
  cursor:pointer;
  font-family:'Galmuri11',monospace;
  font-size:13px;
  padding:2px 6px;
  flex-shrink:0;
}
.icon-btn:hover{color:var(--red);}

.quest-progress-outer{
  height:12px;
  background:var(--input-bg);
  border:2px solid var(--border);
  margin-bottom:10px;
}
.quest-progress-inner{
  height:100%;
  width:0%;
  background:repeating-linear-gradient(90deg, var(--gold) 0 5px, var(--gold-dark) 5px 7px);
  transition:width .3s steps(15);
}

.subtask-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
.subtask-item{display:flex;align-items:center;gap:8px;font-size:11px;}
.pixel-checkbox{
  appearance:none;
  -webkit-appearance:none;
  width:16px;height:16px;
  min-width:16px;
  background:var(--input-bg);
  border:2px solid var(--border-light);
  cursor:pointer;
  position:relative;
  flex-shrink:0;
}
.pixel-checkbox:checked{background:var(--green);border-color:var(--green);}
.pixel-checkbox:checked::after{
  content:"";
  position:absolute;
  left:3px;top:0px;
  width:4px;height:8px;
  border-right:2px solid #0f0e1a;
  border-bottom:2px solid #0f0e1a;
  transform:rotate(40deg);
}
.subtask-text{flex:1;word-break:break-all;}
.subtask-text.done{color:var(--text-dim);text-decoration:line-through;}

.add-subtask-row{display:flex;gap:6px;margin-top:4px;}
.add-subtask-row input{flex:1;font-size:11px;padding:6px 8px;}
.add-subtask-row button{padding:6px 10px;font-size:11px;}

.empty-msg{
  text-align:center;
  color:var(--text-dim);
  font-size:11px;
  padding:24px 6px;
}

/* calendar */
.calendar-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.calendar-title{font-size:12px;color:var(--gold);letter-spacing:1px;}
.calendar-grid{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
}
.cal-dow{
  text-align:center;
  font-size:9px;
  color:var(--text-dim);
  padding-bottom:4px;
}
.cal-cell{
  aspect-ratio:1/1;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:10px;
  background:var(--input-bg);
  border:1px solid var(--border);
  cursor:default;
  color:var(--text-dim);
  position:relative;
}
.cal-cell.empty-slot{background:transparent;border:none;}
.cal-cell.has-data{cursor:pointer;color:var(--text);}
.cal-cell.lvl1{background:#2a3b2a;border-color:#3d523d;}
.cal-cell.lvl2{background:#2f5c3f;border-color:#3f7a52;}
.cal-cell.lvl3{background:#3f8a5a;border-color:#57b878;}
.cal-cell.lvl4{background:var(--green);border-color:var(--green);color:#0f0e1a;font-weight:bold;}
.cal-cell.today{
  outline:3px solid var(--gold);
  outline-offset:-2px;
  background:color-mix(in srgb, var(--gold) 22%, var(--panel));
  color:var(--text);
  font-weight:bold;
}
.cal-cell:hover.has-data{outline:2px solid var(--gold);outline-offset:-1px;}

.legend{display:flex;align-items:center;gap:6px;margin-top:10px;font-size:9px;color:var(--text-dim);flex-wrap:wrap;}
.legend-box{width:10px;height:10px;display:inline-block;}

.stats-row{
  display:flex;
  gap:10px;
  margin-top:12px;
  flex-wrap:wrap;
}
.stat-chip{
  background:var(--input-bg);
  border:2px solid var(--border);
  padding:8px 10px;
  font-size:10px;
  flex:1;
  min-width:110px;
  text-align:center;
}
.stat-chip b{display:block;font-size:14px;color:var(--gold);margin-top:2px;}

/* modal */
.modal-overlay{
  position:fixed;inset:0;
  background:#000000cc;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}
.modal-overlay.open{display:flex;}
.modal-box{
  max-width:420px;
  width:100%;
  max-height:80vh;
  overflow-y:auto;
  padding:18px;
}
.modal-close{position:absolute;top:8px;right:10px;}
.modal-title{font-size:13px;color:var(--gold);margin:0 0 12px;padding-right:24px;}
.modal-quest{margin-bottom:12px;font-size:11px;}
.modal-quest-title{margin-bottom:4px;}
.modal-sub{padding-left:14px;color:var(--text-dim);margin:2px 0;}
.modal-sub.done{color:var(--green);text-decoration:line-through;}

footer.note{
  text-align:center;
  font-size:9px;
  color:var(--text-dim);
  margin-top:8px;
  line-height:1.6;
}
</style>
</head>
<body>

<div class="game-frame">

  <div class="topbar pixel-panel crt">
    <h1 class="logo">⚔ PIXEL QUEST LOG ⚔</h1>
    <div class="date-display" id="dateDisplay"></div>
    <div class="theme-picker" id="themePicker"></div>
    <div style="margin-top:14px;">
      <a href="index.html" target="_top" class="pixel-btn secondary" style="text-decoration:none;display:inline-block;">🗂 레퍼런스 아카이브로 이동</a>
    </div>
  </div>

  <div class="exp-panel pixel-panel crt">
    <div class="exp-top-row">
      <span class="exp-label">TODAY'S PROGRESS</span>
      <span class="streak-badge" id="streakBadge">🔥 0 DAY STREAK</span>
    </div>
    <div class="bar-outer"><div class="bar-inner gold" id="overallBar"></div></div>
    <div class="bar-text" id="overallText">0 / 0 STEPS CLEARED</div>
  </div>

  <div class="quest-board pixel-panel crt">
    <p class="board-title">▶ 오늘의 퀘스트 (주요 작업)</p>
    <div class="add-quest-row">
      <input class="pixel-input" id="newQuestInput" placeholder="오늘 해야 할 주요 작업 입력" maxlength="60">
      <button class="pixel-btn" id="addQuestBtn">+ 퀘스트 추가</button>
    </div>
    <div class="quest-list" id="questList"></div>
    <div class="empty-msg" id="emptyMsg" style="display:none;">아직 등록된 퀘스트가 없습니다.<br>오늘의 주요 작업을 추가해보세요!</div>
  </div>

  <div class="calendar-panel pixel-panel crt">
    <div class="calendar-header">
      <button class="pixel-btn secondary" id="prevMonth">◀</button>
      <span class="calendar-title" id="calendarTitle">2026 - 08</span>
      <button class="pixel-btn secondary" id="nextMonth">▶</button>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>
    <div class="legend">
      <span class="legend-box" style="background:var(--input-bg);border:1px solid var(--border);"></span> 기록없음
      <span class="legend-box lvl1" style="background:#2a3b2a;"></span> 시작
      <span class="legend-box lvl2" style="background:#2f5c3f;"></span> 진행중
      <span class="legend-box lvl3" style="background:#3f8a5a;"></span> 거의완료
      <span class="legend-box lvl4" style="background:#7ee27e;"></span> 100% 클리어
    </div>
    <div class="stats-row">
      <div class="stat-chip">활동 기록일<b id="statTotalDays">0</b></div>
      <div class="stat-chip">완벽 클리어일<b id="statPerfectDays">0</b></div>
      <div class="stat-chip">최장 스트릭<b id="statBestStreak">0</b></div>
    </div>
  </div>

  <footer class="note">
    데이터는 이 브라우저의 localStorage에 저장됩니다.<br>
    같은 브라우저·같은 기기에서만 유지되며, 브라우저 데이터를 지우면 사라집니다.
  </footer>

</div>

<div class="modal-overlay" id="dayModal">
  <div class="modal-box pixel-panel">
    <button class="icon-btn modal-close" id="modalCloseBtn">✕</button>
    <p class="modal-title" id="modalTitle">2026-08-01</p>
    <div id="modalBody"></div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'pixelQuestLogData';
  const THEME_KEY = 'pixelQuestLogTheme';
  const DOW = ['일','월','화','수','목','금','토'];

  const THEMES = [
    {id:'default',  label:'다크 판타지',   c1:'#0f0e1a', c2:'#ffcd3c'},
    {id:'garden',   label:'정원',         c1:'#f2ede1', c2:'#7c9459'},
    {id:'summer',   label:'한여름 초록',   c1:'#f5f7f5', c2:'#7cbb54'},
    {id:'beige',    label:'베이지헤븐',    c1:'#ece2ce', c2:'#a3764a'},
    {id:'retro',    label:'레트로 오렌지', c1:'#f5f2ec', c2:'#ff6a1a'},
    {id:'gameroom', label:'게임룸',       c1:'#1c1712', c2:'#e8433f'}
  ];

  function applyTheme(id){
    if(id==='default'){
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', id);
    }
    try{ localStorage.setItem(THEME_KEY, id); }catch(e){}
    renderThemePicker(id);
  }

  function renderThemePicker(activeId){
    const wrap = document.getElementById('themePicker');
    wrap.innerHTML = '';
    THEMES.forEach(t=>{
      const btn = document.createElement('button');
      btn.className = 'theme-swatch' + (t.id===activeId? ' active':'');
      btn.title = t.label;
      btn.style.background = t.c1;
      btn.onclick = ()=> applyTheme(t.id);
      const dot = document.createElement('span');
      dot.style.background = t.c2;
      btn.appendChild(dot);
      wrap.appendChild(btn);
    });
  }

  function initTheme(){
    let saved = 'default';
    try{ saved = localStorage.getItem(THEME_KEY) || 'default'; }catch(e){}
    applyTheme(saved);
  }

  function pad(n){return n<10?'0'+n:''+n;}
  function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function todayKey(){return keyOf(new Date());}
  function uid(){return Math.random().toString(36).slice(2,9);}

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return {days:{}};
      const parsed = JSON.parse(raw);
      if(!parsed.days) parsed.days = {};
      return parsed;
    }catch(e){
      console.error('load failed', e);
      return {days:{}};
    }
  }
  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }catch(e){
      console.error('save failed', e);
    }
  }

  let data = loadData();
  if(!data.days[todayKey()]) data.days[todayKey()] = {quests:[]};

  let viewYear, viewMonth; // 0-indexed month for calendar view
  (function(){
    const t = new Date();
    viewYear = t.getFullYear();
    viewMonth = t.getMonth();
  })();

  // ---------- stats helpers ----------
  function dayStats(dayObj){
    if(!dayObj || !dayObj.quests || dayObj.quests.length===0){
      return {totalSteps:0, doneSteps:0, percent:0, questTotal:0, questCleared:0};
    }
    let totalSteps=0, doneSteps=0, questCleared=0;
    dayObj.quests.forEach(q=>{
      const subs = q.subtasks||[];
      totalSteps += subs.length;
      const done = subs.filter(s=>s.done).length;
      doneSteps += done;
      if(subs.length>0 && done===subs.length) questCleared++;
    });
    const percent = totalSteps>0 ? Math.round((doneSteps/totalSteps)*100) : 0;
    return {totalSteps, doneSteps, percent, questTotal:dayObj.quests.length, questCleared};
  }

  function levelClass(percent, hasQuests){
    if(!hasQuests) return '';
    if(percent>=100) return 'lvl4';
    if(percent>=50) return 'lvl3';
    if(percent>0) return 'lvl2';
    return 'lvl1';
  }

  function computeStreaks(){
    // walk backward day by day from today; streak breaks on a day with no quests recorded
    // (a logged day with 0% still counts as "activity", counts toward activity streak;
    // for simplicity here streak = consecutive days with at least one quest logged)
    const dates = Object.keys(data.days).sort();
    if(dates.length===0) return {current:0, best:0, totalDays:0, perfectDays:0};

    let totalDays=0, perfectDays=0;
    dates.forEach(k=>{
      const st = dayStats(data.days[k]);
      if(st.questTotal>0) totalDays++;
      if(st.questTotal>0 && st.percent===100) perfectDays++;
    });

    // current streak: consecutive days ending today (or yesterday, if today has no entries yet)
    let current=0;
    let cursor = new Date();
    // if today has no quests logged yet, streak calc still starts checking from today backward,
    // but a day with 0 quests just doesn't count / breaks continuation
    while(true){
      const k = keyOf(cursor);
      const d = data.days[k];
      const st = dayStats(d);
      if(st.questTotal>0){
        current++;
        cursor.setDate(cursor.getDate()-1);
      } else {
        break;
      }
    }

    // best streak across all history
    let best=0, run=0;
    let d0 = new Date(dates[0]+'T00:00:00');
    let dLast = new Date(dates[dates.length-1]+'T00:00:00');
    let cur = new Date(d0);
    while(cur <= dLast){
      const k = keyOf(cur);
      const st = dayStats(data.days[k]);
      if(st.questTotal>0){
        run++;
        best = Math.max(best, run);
      } else {
        run=0;
      }
      cur.setDate(cur.getDate()+1);
    }
    best = Math.max(best, current);

    return {current, best, totalDays, perfectDays};
  }

  // ---------- render: today panel ----------
  function renderToday(){
    const tKey = todayKey();
    const today = data.days[tKey];
    const list = document.getElementById('questList');
    const emptyMsg = document.getElementById('emptyMsg');
    list.innerHTML = '';

    if(!today.quests.length){
      emptyMsg.style.display='block';
    } else {
      emptyMsg.style.display='none';
    }

    today.quests.forEach(q=>{
      const subs = q.subtasks||[];
      const doneCount = subs.filter(s=>s.done).length;
      const percent = subs.length>0 ? Math.round((doneCount/subs.length)*100) : 0;
      const cleared = subs.length>0 && doneCount===subs.length;

      const card = document.createElement('div');
      card.className = 'quest-card' + (cleared? ' cleared':'');

      const header = document.createElement('div');
      header.className = 'quest-header';
      const titleSpan = document.createElement('span');
      titleSpan.className = 'quest-title' + (cleared? ' done':'');
      titleSpan.textContent = q.title;
      if(cleared){
        const stamp = document.createElement('span');
        stamp.className='clear-stamp';
        stamp.textContent='CLEAR!';
        titleSpan.appendChild(stamp);
      }
      const delBtn = document.createElement('button');
      delBtn.className='icon-btn';
      delBtn.textContent='✕';
      delBtn.title='퀘스트 삭제';
      delBtn.onclick = ()=>{ deleteQuest(q.id); };
      header.appendChild(titleSpan);
      header.appendChild(delBtn);
      card.appendChild(header);

      const progOuter = document.createElement('div');
      progOuter.className='quest-progress-outer';
      const progInner = document.createElement('div');
      progInner.className='quest-progress-inner';
      progInner.style.width = percent+'%';
      progOuter.appendChild(progInner);
      card.appendChild(progOuter);

      const ul = document.createElement('ul');
      ul.className='subtask-list';
      subs.forEach(s=>{
        const li = document.createElement('li');
        li.className='subtask-item';
        const cb = document.createElement('input');
        cb.type='checkbox';
        cb.className='pixel-checkbox';
        cb.checked = !!s.done;
        cb.onchange = ()=>{ toggleSubtask(q.id, s.id); };
        const txt = document.createElement('span');
        txt.className='subtask-text'+(s.done?' done':'');
        txt.textContent = s.text;
        const delSub = document.createElement('button');
        delSub.className='icon-btn';
        delSub.textContent='✕';
        delSub.onclick = ()=>{ deleteSubtask(q.id, s.id); };
        li.appendChild(cb);
        li.appendChild(txt);
        li.appendChild(delSub);
        ul.appendChild(li);
      });
      card.appendChild(ul);

      const addRow = document.createElement('div');
      addRow.className='add-subtask-row';
      const inp = document.createElement('input');
      inp.className='pixel-input';
      inp.placeholder='세부 단계 추가';
      inp.maxLength=60;
      const addBtn = document.createElement('button');
      addBtn.className='pixel-btn secondary';
      addBtn.textContent='+';
      const submit = ()=>{
        const v = inp.value.trim();
        if(!v) return;
        addSubtask(q.id, v);
        inp.value='';
      };
      addBtn.onclick = submit;
      inp.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
      addRow.appendChild(inp);
      addRow.appendChild(addBtn);
      card.appendChild(addRow);

      list.appendChild(card);
    });

    // overall bar
    const st = dayStats(today);
    const bar = document.getElementById('overallBar');
    bar.style.width = st.percent + '%';
    document.getElementById('overallText').textContent =
      st.totalSteps===0 ? '아직 등록된 단계가 없습니다' : (st.doneSteps+' / '+st.totalSteps+' STEPS CLEARED ('+st.percent+'%)');

    const streaks = computeStreaks();
    document.getElementById('streakBadge').textContent = '🔥 ' + streaks.current + ' DAY STREAK';
    document.getElementById('statTotalDays').textContent = streaks.totalDays;
    document.getElementById('statPerfectDays').textContent = streaks.perfectDays;
    document.getElementById('statBestStreak').textContent = streaks.best;

    saveData();
    renderCalendar();
  }

  function addQuest(title){
    const tKey = todayKey();
    data.days[tKey].quests.push({id:uid(), title:title, subtasks:[]});
    renderToday();
  }
  function deleteQuest(qid){
    const tKey = todayKey();
    const arr = data.days[tKey].quests;
    const idx = arr.findIndex(q=>q.id===qid);
    if(idx>-1) arr.splice(idx,1);
    renderToday();
  }
  function addSubtask(qid, text){
    const tKey = todayKey();
    const q = data.days[tKey].quests.find(q=>q.id===qid);
    if(q) q.subtasks.push({id:uid(), text:text, done:false});
    renderToday();
  }
  function toggleSubtask(qid, sid){
    const tKey = todayKey();
    const q = data.days[tKey].quests.find(q=>q.id===qid);
    if(q){
      const s = q.subtasks.find(s=>s.id===sid);
      if(s) s.done = !s.done;
    }
    renderToday();
  }
  function deleteSubtask(qid, sid){
    const tKey = todayKey();
    const q = data.days[tKey].quests.find(q=>q.id===qid);
    if(q){
      const idx = q.subtasks.findIndex(s=>s.id===sid);
      if(idx>-1) q.subtasks.splice(idx,1);
    }
    renderToday();
  }

  // ---------- calendar ----------
  function renderCalendar(){
    document.getElementById('calendarTitle').textContent = viewYear+' - '+pad(viewMonth+1);
    const grid = document.getElementById('calendarGrid');
    grid.innerHTML = '';
    DOW.forEach(d=>{
      const el = document.createElement('div');
      el.className='cal-dow';
      el.textContent=d;
      grid.appendChild(el);
    });

    const firstDay = new Date(viewYear, viewMonth, 1);
    const startOffset = firstDay.getDay();
    const daysInMonth = new Date(viewYear, viewMonth+1, 0).getDate();
    const tKey = todayKey();

    for(let i=0;i<startOffset;i++){
      const el = document.createElement('div');
      el.className='cal-cell empty-slot';
      grid.appendChild(el);
    }

    for(let day=1; day<=daysInMonth; day++){
      const dObj = new Date(viewYear, viewMonth, day);
      const k = keyOf(dObj);
      const dayData = data.days[k];
      const st = dayStats(dayData);
      const cell = document.createElement('div');
      const hasData = st.questTotal>0;
      cell.className = 'cal-cell' + (hasData? ' has-data':'') + (hasData? ' '+levelClass(st.percent, hasData):'') + (k===tKey? ' today':'');
      cell.textContent = day;
      if(hasData){
        cell.title = st.doneSteps+'/'+st.totalSteps+' 단계 완료 ('+st.percent+'%)';
        cell.onclick = ()=> openDayModal(k, dayData, st);
      }
      grid.appendChild(cell);
    }

    // disable next-month button if viewing current month already
    const now = new Date();
    const nextBtn = document.getElementById('nextMonth');
    nextBtn.disabled = (viewYear===now.getFullYear() && viewMonth===now.getMonth());
  }

  function openDayModal(k, dayData, st){
    const modal = document.getElementById('dayModal');
    document.getElementById('modalTitle').textContent = k + '  (' + st.doneSteps + '/' + st.totalSteps + ' · ' + st.percent + '%)';
    const body = document.getElementById('modalBody');
    body.innerHTML = '';
    dayData.quests.forEach(q=>{
      const wrap = document.createElement('div');
      wrap.className='modal-quest';
      const t = document.createElement('div');
      t.className='modal-quest-title';
      const subs = q.subtasks||[];
      const done = subs.filter(s=>s.done).length;
      t.textContent = (done===subs.length && subs.length>0 ? '✔ ' : '▸ ') + q.title + '  ('+done+'/'+subs.length+')';
      wrap.appendChild(t);
      subs.forEach(s=>{
        const sEl = document.createElement('div');
        sEl.className = 'modal-sub'+(s.done?' done':'');
        sEl.textContent = (s.done?'☑ ':'☐ ') + s.text;
        wrap.appendChild(sEl);
      });
      body.appendChild(wrap);
    });
    if(!dayData.quests.length){
      body.innerHTML = '<div class="empty-msg">이 날은 기록된 퀘스트가 없습니다.</div>';
    }
    modal.classList.add('open');
  }

  document.getElementById('modalCloseBtn').onclick = ()=>{
    document.getElementById('dayModal').classList.remove('open');
  };
  document.getElementById('dayModal').addEventListener('click', e=>{
    if(e.target.id==='dayModal') e.currentTarget.classList.remove('open');
  });

  document.getElementById('prevMonth').onclick = ()=>{
    viewMonth--;
    if(viewMonth<0){viewMonth=11; viewYear--;}
    renderCalendar();
  };
  document.getElementById('nextMonth').onclick = ()=>{
    const now = new Date();
    if(viewYear===now.getFullYear() && viewMonth===now.getMonth()) return;
    viewMonth++;
    if(viewMonth>11){viewMonth=0; viewYear++;}
    renderCalendar();
  };

  const newQuestInput = document.getElementById('newQuestInput');
  const addQuestBtn = document.getElementById('addQuestBtn');
  function submitQuest(){
    const v = newQuestInput.value.trim();
    if(!v) return;
    addQuest(v);
    newQuestInput.value='';
  }
  addQuestBtn.onclick = submitQuest;
  newQuestInput.addEventListener('keydown', e=>{ if(e.key==='Enter') submitQuest(); });

  function renderDateDisplay(){
    const now = new Date();
    const wd = DOW[now.getDay()];
    document.getElementById('dateDisplay').textContent =
      now.getFullYear()+'.'+pad(now.getMonth()+1)+'.'+pad(now.getDate())+' ('+wd+')';
  }

  initTheme();
  renderDateDisplay();
  renderToday();
})();
</script>
</body>
